name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the newest Python PyPy supports (docs/handoff-brief.md).
        python-version: ["3.11", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # m68000-python is a private repository, pinned by revision in pyproject.toml.
      # CI reaches it with a read-only deploy key on that repository (its private
      # half is the M68000_PYTHON_KEY secret here): narrower than a personal token,
      # which would reach every repository the account can read.
      - name: Give git access to m68000-python
        env:
          KEY: ${{ secrets.M68000_PYTHON_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/m68000 && chmod 600 ~/.ssh/m68000
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            printf 'Host github.com\n  IdentityFile ~/.ssh/m68000\n  IdentitiesOnly yes\n' > ~/.ssh/config
            git config --global url."git@github.com:alewman/m68000-python".insteadOf \
              "https://github.com/alewman/m68000-python"
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The judges of milestones 2 and 3: Nemesis's captures, VDPFIFOTesting, his
      # sprite masking ROM and the two photographs of his MD1600 running it, and MoD's
      # gen_test_z80_bus, all fetched at their pinned SHA-256 (never committed).
      # Milestone 1 needs MAME and the commercial romset and runs locally
      # (pytest -m slow).
      - run: |
          python scripts/fetch_references.py --no-repos \
            --only tests/test_roms/nemesis/ \
            --only tests/test_roms/mask-of-destiny/ \
            --only reference/images/
      # Milestone 4's judges are die-derived models, which have to be built and run:
      # three small source trees at their pinned revisions, then one gcc each
      # (validation/build_referees.sh). Their binaries are referees, never shipped.
      # --no-files: this step is for the three trees alone. Without it, it fetched
      # every pinned file too, and failed from milestone 8 on, when a pin that only
      # this machine's No-Intro mirror can supply (MD Soft Checker) was added.
      - run: |
          python scripts/fetch_references.py --no-files \
            --repo Nuked-OPN2 --repo Nuked-PSG --repo YM2608-LLE
          sh validation/build_referees.sh
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
